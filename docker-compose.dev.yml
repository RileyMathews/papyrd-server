# Dev compose — builds and runs Papyrd with Postgres.
# Usage: docker compose -f docker-compose.dev.yml up --build
# Then:  ./scripts/seed-dev.sh   (creates admin + uploads test book)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: papyrd
      POSTGRES_USER: papyrd
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papyrd -d papyrd"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://papyrd:password@postgres:5432/papyrd
      PAPYRD_SESSION_SECRET: dev-only-not-secret-change-before-real-use
      PAPYRD_STORAGE_ROOT: /app/storage
    volumes:
      - dev-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dev-storage:
